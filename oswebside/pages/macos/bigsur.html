<!DOCTYPE html>
<html lang="pl">

<head>

    <link rel="stylesheet" href="../../styles/main.css">

</head>

<body class="bigsur-page">

    <div class="mac-navbar">

    </div>

    <div class="mac-window" style="background: rgba(255,255,255,0.8);">
        <div class="mac-titlebar">
            <div class="traffic-lights">
                <div class="traffic-dot close"></div>
                <div class="traffic-dot minimize"></div>
                <div class="traffic-dot maximize"></div>
            </div>
            <div style="flex-grow: 1; text-align: center; color: #555;">Finder</div>

                <div style="padding: 5px;">Dokumenty</div>
                <div style="padding: 5px;">Pobrane</div>

            <div style="padding: 40px; flex-grow: 1;">
                <h1 style="color: #1d1d1f; margin-bottom: 20px;">Odważny. Nowy. Design.</h1>
                <p style="font-size: 1.2rem; color: #333;">MacOS Big Sur wprowadza największą zmianę w wyglądzie od

                <div style="margin-top: 40px; display: flex; gap: 20px;">
                    <div style="text-align: center;">
                        <div
                            style="width: 60px; height: 60px; background: #007aff; border-radius: 14px; margin: 0 auto; box-shadow: 0 5px 10px rgba(0,0,0,0.2);">
                        </div>
                        <p style="margin-top: 10px; font-size: 0.8rem;">Ikony "Squircle"</p>
                    </div>
                    <div style="text-align: center;">
                        <div
                            style="width: 60px; height: 60px; background: #34c759; border-radius: 14px; margin: 0 auto; box-shadow: 0 5px 10px rgba(0,0,0,0.2);">
                        </div>
                        <p style="margin-top: 10px; font-size: 0.8rem;">Spójny kształt</p>
                    </div>
                    <div style="text-align: center;">
                        <div
                            style="width: 60px; height: 60px; background: #ff2d55; border-radius: 14px; margin: 0 auto; box-shadow: 0 5px 10px rgba(0,0,0,0.2);">
                        </div>
                        <p style="margin-top: 10px; font-size: 0.8rem;">Więcej głębi</p>
