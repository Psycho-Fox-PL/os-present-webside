<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macOS Monterey</title>
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="../../styles/macos.css">
</head>

<body class="monterey-page">

    <div class="mac-navbar">
        <div style="font-weight: bold; margin-right: 20px;"></div>
        <div>macOS Monterey</div>
        <div style="flex-grow: 1;"></div>
        <a href="../../index.html" style="margin-left: 20px; font-weight: normal;">Powrót</a>
    </div>

    <div style="display: flex; height: 100vh; align-items: center; justify-content: center; gap: 50px; padding: 50px;">

        <!-- iPad Simulation -->
        <div
            style="width: 300px; height: 400px; background: #fff; border-radius: 20px; border: 10px solid #222; box-shadow: 0 20px 50px rgba(0,0,0,0.5); padding: 20px; position: relative;">
            <div style="text-align: center; margin-top: 50%; transform: translateY(-50%);">
                <h3>iPad</h3>
                <p>Sidecar</p>
            </div>
            <!-- Cursor crossing over -->
            <div style="position: absolute; right: -30px; top: 50%; font-size: 2rem;">↗️</div>
        </div>

        <!-- Mac Simulation -->
        <div class="mac-window" style="margin: 0; width: 600px; min-height: 450px;">
            <div class="mac-titlebar">
                <div class="traffic-lights">
                    <div class="traffic-dot close"></div>
                    <div class="traffic-dot minimize"></div>
                    <div class="traffic-dot maximize"></div>
                </div>
            </div>
            <div class="mac-content">
                <h1 style="font-size: 2.5rem; color: #1d1d1f; margin-bottom: 10px;">High Power.</h1>
                <h2 style="font-size: 1.5rem; color: #a569bd; margin-bottom: 30px;">Universal Control.</h2>
                <p style="font-size: 1.1rem; color: #333;">Jedna klawiatura. Jedna mysz. Wszystkie twoje urządzenia.</p>
                <p style="margin-top: 20px; color: #555;">Przesuwaj kursor między Makiem a iPadem tak naturalnie, jakby
                    to był jeden ekran.</p>

                <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ccc;">

                <div style="display: flex; gap: 20px;">
                    <div style="flex: 1;">
                        <h4>Skróty</h4>
                        <p style="font-size: 0.9rem;">Automatyzuj zadania jak na iOS.</p>
                    </div>
                    <div style="flex: 1;">
                        <h4>Safari</h4>
                        <p style="font-size: 0.9rem;">Nowy design kart i grupy kart.</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
